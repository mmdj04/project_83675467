name: Sync Upstream Changelog

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  sync-changelog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rebuild changelog from full upstream history
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");

            const UPSTREAM_OWNER = "arhamkhnz";
            const UPSTREAM_REPO = "next-shadcn-admin-dashboard";
            const changelogPath = "changelog.md";
            const cachePath = ".github/commit-files.json";
            const prCachePath = ".github/commit-prs.json";

            const MAX_FILES = 15;
            const STATUS_LABEL = {
              added: "adicionado",
              removed: "removido",
              modified: "modificado",
              renamed: "renomeado",
              copied: "copiado",
              changed: "alterado",
              unchanged: "sem mudança",
            };
            const STATUS_REVERSE = Object.fromEntries(
              Object.entries(STATUS_LABEL).map(([k, v]) => [v, k]),
            );
            const TYPE_LABEL = {
              feat: "novidades",
              fix: "correções",
              refactor: "refatorações",
              chore: "manutenção",
              docs: "documentação",
              perf: "performance",
              style: "estilo",
              test: "testes",
              build: "build",
              ci: "ci",
              revert: "reversões",
              deps: "dependências",
            };

            const fmt = (n) => Number(n).toLocaleString("pt-BR");
            const VERBS = new Set([
              "add", "added", "update", "updated", "updates", "fix", "fixed",
              "fixes", "refactor", "refactored", "improve", "improved",
              "remove", "removed", "migrate", "migrated", "implement",
              "implemented", "organize", "organized", "rename", "renamed",
              "optimize", "optimized", "swap", "swapped", "promote",
              "promoted", "move", "moved", "adopt", "adopted", "expand",
              "expanded", "create", "created", "change", "changed", "enable",
              "enabled", "disable", "disabled", "refine", "refined",
              "polish", "polished", "tighten", "tightened", "simplify",
              "simplified", "revert", "reverted", "feat", "chore",
            ]);
            const VERB_CAP = {
              add: "Added", added: "Added", update: "Updated",
              updated: "Updated", updates: "Updated", fix: "Fixed",
              fixed: "Fixed", fixes: "Fixed", refactor: "Refactored",
              refactored: "Refactored", improve: "Improved",
              improved: "Improved", remove: "Removed", removed: "Removed",
              migrate: "Migrated", migrated: "Migrated",
              implement: "Implemented", implemented: "Implemented",
              organize: "Organized", organized: "Organized",
              rename: "Renamed", renamed: "Renamed", optimize: "Optimized",
              optimized: "Optimized", swap: "Swapped", swapped: "Swapped",
              promote: "Promoted", promoted: "Promoted", move: "Moved",
              moved: "Moved", adopt: "Adopted", adopted: "Adopted",
              expand: "Expanded", expanded: "Expanded", create: "Created",
              created: "Created", change: "Changed", changed: "Changed",
              enable: "Enabled", enabled: "Enabled", disable: "Disabled",
              disabled: "Disabled", refine: "Refined", refined: "Refined",
              polish: "Polished", polished: "Polished",
              tighten: "Tightened", tightened: "Tightened",
              simplify: "Simplified", simplified: "Simplified",
              revert: "Reverted", reverted: "Reverted", feat: "Added",
              chore: "Maintained",
            };
            const prettyItem = (msg) => {
              const clean = msg.replace(
                /^(feat|fix|refactor|chore|docs|perf|style|test|build|ci|revert|deps)(\([^)]*\))?:\s*/,
                "",
              );
              const words = clean.split(/\s+/).filter(Boolean);
              if (words.length === 0) return msg;
              const verb = words[0].toLowerCase();
              if (VERBS.has(verb)) {
                const cap =
                  VERB_CAP[verb] || verb[0].toUpperCase() + verb.slice(1);
                const rest = words.slice(1);
                if (rest.length === 0) return cap;
                const bold = rest.slice(0, 3).join(" ");
                const tail = rest.slice(3).join(" ");
                return `${cap} **${bold}**${tail ? ` ${tail}` : ""}`;
              }
              return (
                words[0][0].toUpperCase() + words[0].slice(1) + " " +
                words.slice(1).join(" ")
              );
            };
            const current = fs.readFileSync(changelogPath, "utf8");

            let cache = {};
            try {
              cache = JSON.parse(fs.readFileSync(cachePath, "utf8"));
            } catch {}

            {
              const lines = current.split("\n");
              let curHash = null;
              for (const line of lines) {
                const em = line.match(
                  /^- \d{4}-\d{2}-\d{2} — `([a-f0-9]{7})` — .+$/,
                );
                if (em) {
                  curHash = em[1];
                  continue;
                }
                const fm = line.match(
                  /^\s+- (.+) \(([a-z ]+)(?: \(\+([\d.]+) −([\d.]+)\))?\)$/,
                );
                if (fm && curHash && !/outros arquivos/.test(fm[1])) {
                  cache[curHash] = cache[curHash] || [];
                  cache[curHash].push({
                    filename: fm[1],
                    status: STATUS_REVERSE[fm[2]] || fm[2],
                    additions: Number((fm[3] || "0").replace(/\./g, "")),
                    deletions: Number((fm[4] || "0").replace(/\./g, "")),
                  });
                }
              }
            }

            const allCommits = [];
            for (let page = 1; page <= 50; page++) {
              const { data } = await github.rest.repos.listCommits({
                owner: UPSTREAM_OWNER,
                repo: UPSTREAM_REPO,
                sha: "main",
                per_page: 100,
                page,
              });
              allCommits.push(...data);
              if (data.length < 100) break;
            }

            const need = allCommits.filter(
              (c) => !cache[c.sha.slice(0, 7)],
            );
            for (let i = 0; i < need.length; i += 10) {
              const chunk = need.slice(i, i + 10);
              const results = await Promise.all(
                chunk.map(async (c) => {
                  const { data } = await github.rest.repos.getCommit({
                    owner: UPSTREAM_OWNER,
                    repo: UPSTREAM_REPO,
                    ref: c.sha,
                  });
                  return data.files || [];
                }),
              );
              results.forEach((files, j) => {
                cache[chunk[j].sha.slice(0, 7)] = files.map((f) => ({
                  filename: f.filename,
                  status: f.status,
                  additions: f.additions,
                  deletions: f.deletions,
                }));
              });
            }

                        let prCache = {};
            try {
              prCache = JSON.parse(
                fs.readFileSync(prCachePath, "utf8"),
              );
            } catch {}

            for (const c of allCommits) {
              const short = c.sha.slice(0, 7);
              if (prCache[short] !== undefined) continue;
              const refs = [
                ...(c.commit.message || "").matchAll(/#(\d+)/g),
              ].map((m) => Number(m[1]));
              if (refs.length) {
                prCache[short] = [...new Set(refs)];
              }
            }

            const PR_FETCH_RE =
              /^(feat|fix|refactor|perf|docs|style|test)(\([^)]*\))?:\s/;
            const needPrs = allCommits.filter((c) => {
              const short = c.sha.slice(0, 7);
              if (prCache[short] !== undefined) return false;
              return PR_FETCH_RE.test(c.commit.message.split("\n")[0]);
            });
            for (let i = 0; i < needPrs.length; i += 10) {
              const chunk = needPrs.slice(i, i + 10);
              const results = await Promise.all(
                chunk.map(async (c) => {
                  try {
                    const { data } =
                      await github.rest.repos.listPullRequestsAssociatedWithCommit(
                        {
                          owner: UPSTREAM_OWNER,
                          repo: UPSTREAM_REPO,
                          commit_sha: c.sha,
                        },
                      );
                    return data.map((p) => p.number);
                  } catch {
                    return [];
                  }
                }),
              );
              results.forEach((prs, j) => {
                prCache[chunk[j].sha.slice(0, 7)] = prs;
              });
            }

            const monthData = new Map();
            for (const c of allCommits) {
              const short = c.sha.slice(0, 7);
              const date = c.commit.author.date.slice(0, 10);
              const month = date.slice(0, 7);
              const message = c.commit.message.split("\n")[0];
              if (!monthData.has(month)) {
                monthData.set(month, { commits: [], files: new Map() });
              }
              const md = monthData.get(month);
              md.commits.push({
                message,
                login: c.author && c.author.login,
                prs: prCache[short] || [],
              });
              for (const f of cache[short] || []) {
                const cur =
                  md.files.get(f.filename) || {
                    status: new Set(),
                    add: 0,
                    del: 0,
                  };
                cur.status.add(f.status);
                cur.add += f.additions;
                cur.del += f.deletions;
                md.files.set(f.filename, cur);
              }
            }

            const TYPE_RE =
              /^(feat|fix|refactor|chore|docs|perf|style|test|build|ci|revert|deps)(\([^)]*\))?:\s/;
            const monthSet = [...monthData.keys()].sort();
            const minMonth = monthSet[0];
            const maxMonth = monthSet[monthSet.length - 1];
            const allMonths = [];
            let [y, m] = minMonth.split("-").map(Number);
            const [maxY, maxM] = maxMonth.split("-").map(Number);
            while (y < maxY || (y === maxY && m <= maxM)) {
              allMonths.push(
                `${String(y).padStart(4, "0")}-${String(m).padStart(2, "0")}`,
              );
              m++;
              if (m > 12) {
                m = 1;
                y++;
              }
            }
            allMonths.reverse();

            const sections = allMonths.map((month) => {
              const md = monthData.get(month);
              if (!md) return `## ${month}\n\n- Nenhum commit registrado.`;

              const types = {};
              const typeItems = new Map();
              for (const c of md.commits) {
                const tm = c.message.match(TYPE_RE);
                if (tm) {
                  const label = TYPE_LABEL[tm[1]];
                  types[label] = (types[label] || 0) + 1;
                  if (!typeItems.has(label)) typeItems.set(label, []);
                  const arr = typeItems.get(label);
                  const existing = arr.find(
                    (x) => x.message === c.message,
                  );
                  if (existing) {
                    existing.prs.push(...c.prs);
                  } else {
                    arr.push({ message: c.message, prs: [...c.prs] });
                  }
                } else if (/^Merge/.test(c.message)) {
                  types["merges"] = (types["merges"] || 0) + 1;
                } else {
                  types["outros"] = (types["outros"] || 0) + 1;
                }
              }
              const typeSummary = Object.entries(types)
                .filter(([, n]) => n > 0)
                .map(([k, n]) => `${n} ${k}`)
                .join(", ");
              const SECTION_ORDER = [
                "novidades", "correções", "refatorações", "manutenção",
                "documentação", "performance", "estilo", "testes",
                "build", "ci", "reversões", "dependências",
              ];
              const fileArr = [...md.files.entries()].sort(
                (a, b) =>
                  b[1].add + b[1].del - (a[1].add + a[1].del),
              );
              const statusOf = (s) => {
                const has = (x) => s.has(x);
                if (has("added") && has("removed")) return "adicionado e removido";
                if (has("added")) return "adicionado";
                if (has("removed")) return "removido";
                if (has("renamed")) return "renomeado";
                return "modificado";
              };
              const shown = fileArr.map(([name, f]) => {
                const stats =
                  f.add > 0 || f.del > 0
                    ? `, +${fmt(f.add)} −${fmt(f.del)}`
                    : "";
                return `- ${name} (${statusOf(f.status)}${stats})`;
              });
              const totalAdd = fileArr.reduce((s, [, f]) => s + f.add, 0);
              const totalDel = fileArr.reduce((s, [, f]) => s + f.del, 0);

              const lines = [
                `## ${month}`,
                "",
                `**Resumo**: ${md.commits.length} commits • ${fileArr.length} arquivos • +${fmt(totalAdd)} −${fmt(totalDel)}${
                  typeSummary ? ` • ${typeSummary}` : ""
                }`,
              ];
              for (const label of SECTION_ORDER) {
                const items = typeItems.get(label);
                if (!items || items.length === 0) continue;
                lines.push("", `### ${label[0].toUpperCase()}${label.slice(1)}`);
                for (const item of items) {
                  const text = prettyItem(item.message);
                  const uniqPrs = [...new Set(item.prs)].slice(0, 4);
                  const suffix = uniqPrs.length
                    ? ` (${uniqPrs.map((p) => `#${p}`).join(", ")})`
                    : "";
                  lines.push(`- ${text}${suffix}`);
                }
              }
              if (shown.length) {
                lines.push("", "### Arquivos principais", ...shown);
              }
              const contribs = [
                ...new Set(
                  md.commits
                    .map((c) =>
                      c.login === "arhamkhnz" ? "mmdj04" : c.login,
                    )
                    .filter((l) => l && !l.includes("[bot]")),
                ),
              ].sort((a, b) => a.localeCompare(b));
              if (contribs.length) {
                lines.push(
                  "",
                  "### Contribuidores",
                  ...contribs.map((l) => `- @${l}`),
                );
              }
              return lines.join("\n");
            });

            const content =
              "# Changelog\n\n" +
              "Histórico do projeto por mês — cada mês resume todos os commits como uma única atualização " +
              "(novidades, correções, arquivos agregados e contribuidores).\n\n" +
              sections.join("\n\n---\n\n") +
              "\n";

            if (current === content) {
              core.notice("Changelog já está em dia com o upstream.");
              return;
            }

            const monthOf = (text) => {
              const mm = new Map();
              const parts = text.split(/^## /m);
              for (const p of parts) {
                const h = p.match(/^(\d{4}-\d{2})\n([\s\S]*)$/);
                if (h) mm.set(h[1], h[2].trim());
              }
              return mm;
            };
            const curM = monthOf(current);
            const newM = monthOf(content);
            const changedMonths = [...newM.keys()].filter(
              (k) => curM.get(k) !== newM.get(k),
            );

            fs.writeFileSync(changelogPath, content);
            fs.writeFileSync(cachePath, JSON.stringify(cache));
            fs.writeFileSync(prCachePath, JSON.stringify(prCache));

            await exec.exec("git", [
              "config",
              "user.name",
              "github-actions[bot]",
            ]);
            await exec.exec("git", [
              "config",
              "user.email",
              "41898282+github-actions[bot]@users.noreply.github.com",
            ]);
            await exec.exec("git", [
              "add",
              changelogPath,
              cachePath,
              prCachePath,
            ]);
            await exec.exec("git", [
              "commit",
              "-m",
              `docs: sync changelog (${changedMonths.length} month(s) updated)`,
            ]);
            await exec.exec("git", ["push"]);

            const changedSummary = changedMonths
              .map((k) => {
                const res = newM
                  .get(k)
                  .match(/\*\*Resumo\*\*: (.+)/);
                return `- ${k}: ${res ? res[1] : ""}`;
              })
              .slice(0, 10);

            const latest = allCommits[0];
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Upstream: changelog atualizado (${changedMonths.length} mês(es))`,
              body: `Changelog sincronizado com o histórico completo de [${UPSTREAM_OWNER}/${UPSTREAM_REPO}](https://github.com/${UPSTREAM_OWNER}/${UPSTREAM_REPO}/commits/main/).\n\nÚltimo commit upstream: [\`${latest.sha.slice(0, 7)}\`](https://github.com/${UPSTREAM_OWNER}/${UPSTREAM_REPO}/commit/${latest.sha}) — ${latest.commit.author.date.slice(0, 10)} — ${latest.commit.message.split("\n")[0]}\n\nMeses atualizados:\n\n${changedSummary.join("\n")}\n\nVerifique se as dependências precisam ser atualizadas (\`npm install\`).`,
            });