name: Sync Upstream Changelog

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  sync-changelog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rebuild changelog from full upstream history
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");

            const UPSTREAM_OWNER = "arhamkhnz";
            const UPSTREAM_REPO = "next-shadcn-admin-dashboard";
            const changelogPath = "changelog.md";

            const allCommits = [];
            for (let page = 1; page <= 50; page++) {
              const { data } = await github.rest.repos.listCommits({
                owner: UPSTREAM_OWNER,
                repo: UPSTREAM_REPO,
                sha: "main",
                per_page: 100,
                page,
              });
              allCommits.push(...data);
              if (data.length < 100) break;
            }

            const byMonth = new Map();
            const dates = [];
            for (const c of allCommits) {
              const date = c.commit.author.date.slice(0, 10);
              const month = date.slice(0, 7);
              dates.push(date);
              if (!byMonth.has(month)) byMonth.set(month, []);
              byMonth
                .get(month)
                .push(`- ${date} — \`${c.sha.slice(0, 7)}\` — ${c.commit.message.split("\n")[0]}`);
            }

            const monthSet = [...byMonth.keys()].sort();
            const minMonth = monthSet[0];
            const maxMonth = monthSet[monthSet.length - 1];
            const allMonths = [];
            let [y, m] = minMonth.split("-").map(Number);
            const [maxY, maxM] = maxMonth.split("-").map(Number);
            while (y < maxY || (y === maxY && m <= maxM)) {
              allMonths.push(`${String(y).padStart(4, "0")}-${String(m).padStart(2, "0")}`);
              m++;
              if (m > 12) {
                m = 1;
                y++;
              }
            }
            allMonths.reverse();

            const sections = allMonths.map((month) => {
              const entries = byMonth.get(month);
              return `## ${month}\n\n${
                entries ? entries.join("\n") : "- Nenhum commit registrado."
              }`;
            });

            const content =
              "# Changelog\n\n" +
              "Histórico do projeto organizado por mês de commit, do mais recente ao mais antigo. " +
              "Cada entrada representa um commit do projeto; commits de merge também são mantidos.\n\n" +
              sections.join("\n\n") +
              "\n";

            const current = fs.readFileSync(changelogPath, "utf8");

            if (current === content) {
              core.notice("Changelog já está em dia com o upstream.");
              return;
            }

            const diffLines = current.split("\n");
            const contentLines = content.split("\n");
            let added = 0;
            const contentSet = new Set(contentLines);
            for (const line of diffLines) {
              if (/^- \d{4}-\d{2}-\d{2} —/.test(line) && !contentSet.has(line)) {
                added++;
              }
            }

            fs.writeFileSync(changelogPath, content);

            await exec.exec("git", ["config", "user.name", "github-actions[bot]"]);
            await exec.exec("git", ["config", "user.email", "41898282+github-actions[bot]@users.noreply.github.com"]);
            await exec.exec("git", ["add", changelogPath]);
            await exec.exec("git", ["commit", "-m", `docs: sync changelog with full upstream history (${added} new entries)`]);
            await exec.exec("git", ["push"]);

            const oldSet = new Set(diffLines);
            const firstNew = contentLines.filter(
              (l) => /^- \d{4}-\d{2}-\d{2} —/.test(l) && !oldSet.has(l),
            ).slice(0, 50);

            const latest = allCommits[0];
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Upstream: changelog atualizado (${added} nova(s) entrada(s))`,
              body: `Changelog sincronizado com o histórico completo de [${UPSTREAM_OWNER}/${UPSTREAM_REPO}](https://github.com/${UPSTREAM_OWNER}/${UPSTREAM_REPO}/commits/main/).\n\nÚltimo commit upstream: [\`${latest.sha.slice(0, 7)}\`](https://github.com/${UPSTREAM_OWNER}/${UPSTREAM_REPO}/commit/${latest.sha}) — ${latest.commit.author.date.slice(0, 10)} — ${latest.commit.message.split("\n")[0]}\n\n${
                added > 0 ? `Entradas novas ou corrigidas (amostra):\n\n${firstNew.join("\n")}\n\n` : ""
              }Verifique se as dependências precisam ser atualizadas (\`npm install\`).`,
            });