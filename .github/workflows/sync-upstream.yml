name: Sync Original Version Branch

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout original-version
        uses: actions/checkout@v4
        with:
          ref: original-version
          fetch-depth: 0

      - name: Add upstream remote
        run: git remote add upstream https://github.com/arhamkhnz/next-shadcn-admin-dashboard.git

      - name: Fetch upstream main
        run: git fetch upstream main

      - name: Sync branch to upstream
        run: |
          git checkout original-version
          git merge --ff-only upstream/main || git reset --hard upstream/main

      - name: Push
        run: git push origin original-version
